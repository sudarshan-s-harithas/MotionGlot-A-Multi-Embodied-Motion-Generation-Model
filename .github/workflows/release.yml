name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,demo]'
      - run: python -m pytest -q
        env:
          TOKENIZERS_PARALLELISM: 'false'
      - name: Download and verify public checkpoints
        run: python examples/download_checkpoints.py --output /tmp/motionglot-release-checkpoints
      - name: Package source and checkpoints
        run: |
          python examples/export_source.py
          python examples/package_checkpoints.py --input /tmp/motionglot-release-checkpoints
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/MotionGlot-source.zip dist/motionglot-checkpoints-v0.1.0.tar.gz dist/motionglot-checkpoints-v0.1.0.tar.gz.sha256 \
            --repo "$RELEASE_REPO" --verify-tag --title "MotionGlot $RELEASE_TAG: local demo and checkpoints" \
            --notes-file docs/release-v0.1.0.md
